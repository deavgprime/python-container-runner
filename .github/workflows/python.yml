name: Python launcher checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dockerproj/requirements.txt
      - run: python -m pip install -r dockerproj/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t python-container-runner dockerproj
      - name: Check container response
        run: |
          docker run -d --name runner-test -p 8000:8000 python-container-runner
          trap 'docker logs runner-test; docker rm -f runner-test' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://localhost:8000/json
